<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSTTELA - AI Journalism Research Graph</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Crimson+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --bg-hover: #252525;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --text-dim: #606060;
            --accent-paper: #4ECDC4;
            --accent-author: #FF6B6B;
            --accent-topic: #95E1D3;
            --accent-seed: #FFD700;
            --new-today: #00ff88;
            --new-recent: #44ff99;
            --new-week: #88ffaa;
            --arxiv-color: #B31B1B;
            --s2-color: #1E88E5;
            --font-mono: 'JetBrains Mono', monospace;
            --font-serif: 'Crimson Pro', serif;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-mono);
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--bg-dark);
            border-bottom: 2px solid var(--accent-paper);
            padding: 1rem 2rem;
        }
        
        .header-content {
            max-width: 1800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            color: var(--accent-paper);
            text-transform: uppercase;
        }
        
        .stats {
            display: flex;
            gap: 2rem;
            font-size: 0.75rem;
            color: var(--text-dim);
        }
        
        .stat-item span {
            color: var(--text-primary);
            font-weight: 700;
            margin-left: 0.25rem;
        }
        
        .view-toggle {
            display: flex;
            gap: 0.5rem;
        }
        
        .view-btn {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid var(--text-dim);
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .view-btn:hover {
            border-color: var(--accent-paper);
            color: var(--accent-paper);
        }
        
        .view-btn.active {
            background: var(--accent-paper);
            border-color: var(--accent-paper);
            color: var(--bg-dark);
        }
        
        .filters-panel {
            position: fixed;
            top: 80px;
            left: 2rem;
            z-index: 999;
            background: var(--bg-card);
            border: 1px solid var(--text-dim);
            padding: 1rem;
            width: 280px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
        }
        
        .filters-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--text-dim);
            padding-bottom: 0.5rem;
        }
        
        .filter-group {
            margin-bottom: 1.5rem;
        }
        
        .filter-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 0.5rem;
        }
        
        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }
        
        .filter-checkbox input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-paper);
            cursor: pointer;
        }
        
        .filter-checkbox label {
            font-size: 0.75rem;
            cursor: pointer;
            color: var(--text-primary);
        }
        
        .badge-preview {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            border-radius: 2px;
            font-size: 0.6rem;
            font-weight: 700;
            margin-left: 0.5rem;
        }
        
        .badge-arxiv {
            background: var(--arxiv-color);
            color: white;
        }
        
        .badge-s2 {
            background: var(--s2-color);
            color: white;
        }
        
        main {
            margin-top: 80px;
            padding: 2rem;
            padding-left: 320px;
        }
        
        #graph-container {
            width: 100%;
            height: calc(100vh - 120px);
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            border: 1px solid var(--text-dim);
            position: relative;
        }
        
        #graph-tooltip {
            position: absolute;
            background: var(--bg-card);
            border: 1px solid var(--accent-paper);
            padding: 1rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            max-width: 400px;
            z-index: 100;
            font-size: 0.75rem;
        }
        
        #graph-tooltip.show {
            opacity: 1;
        }
        
        .tooltip-title {
            font-family: var(--font-serif);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }
        
        .tooltip-meta {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        
        .tooltip-abstract {
            font-size: 0.7rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin-top: 0.5rem;
        }
        
        #grid-container {
            display: none;
            max-width: 1600px;
            margin: 0 auto;
        }
        
        #grid-container.active {
            display: block;
        }
        
        .grid-section {
            margin-bottom: 3rem;
        }
        
        .section-title {
            font-family: var(--font-serif);
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            border-left: 4px solid var(--accent-paper);
            padding-left: 1rem;
        }
        
        .papers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        
        .paper-card {
            background: var(--bg-card);
            border: 1px solid var(--text-dim);
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            cursor: pointer;
        }
        
        .paper-card:hover {
            border-color: var(--accent-paper);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(78, 205, 196, 0.15);
        }
        
        .paper-card.favorite {
            border-color: var(--accent-paper);
        }
        
        .paper-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }
        
        .paper-badges {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        .badge {
            padding: 0.25rem 0.5rem;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .badge-source {
            background: var(--arxiv-color);
            color: white;
        }
        
        .badge-source.s2 {
            background: var(--s2-color);
        }
        
        .badge-new {
            background: var(--new-today);
            color: var(--bg-dark);
        }
        
        .badge-seed {
            background: var(--accent-seed);
            color: var(--bg-dark);
        }
        
        .favorite-btn {
            background: transparent;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            transition: transform 0.2s;
            line-height: 1;
        }
        
        .favorite-btn:hover {
            transform: scale(1.2);
        }
        
        .paper-title {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }
        
        .paper-abstract {
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 0.75rem;
        }
        
        .paper-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.65rem;
            color: var(--text-dim);
            border-top: 1px solid var(--text-dim);
            padding-top: 0.75rem;
        }
        
        @media (max-width: 1200px) {
            main {
                padding-left: 2rem;
            }
            
            .filters-panel {
                left: -280px;
                transition: left 0.3s;
            }
            
            .filters-panel.mobile-open {
                left: 0;
            }
        }
        
        @media (max-width: 768px) {
            .header-content {
                flex-wrap: wrap;
            }
            
            .stats {
                order: 3;
                width: 100%;
                justify-content: center;
            }
            
            .papers-grid {
                grid-template-columns: 1fr;
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .paper-card {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) backwards;
        }
        
        .paper-card:nth-child(1) { animation-delay: 0.05s; }
        .paper-card:nth-child(2) { animation-delay: 0.1s; }
        .paper-card:nth-child(3) { animation-delay: 0.15s; }
        .paper-card:nth-child(4) { animation-delay: 0.2s; }
        .paper-card:nth-child(5) { animation-delay: 0.25s; }
        .paper-card:nth-child(6) { animation-delay: 0.3s; }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">MUSTTELA</div>
            
            <div class="stats">
                <div class="stat-item">PAPERS: <span id="stat-papers">0</span></div>
                <div class="stat-item">AUTHORS: <span id="stat-authors">0</span></div>
                <div class="stat-item">TOPICS: <span id="stat-topics">0</span></div>
            </div>
            
            <div class="view-toggle">
                <button class="view-btn active" data-view="graph">GRAPH</button>
                <button class="view-btn" data-view="grid">GRID</button>
            </div>
        </div>
    </header>
    
    <aside class="filters-panel">
        <div class="filters-title">Filtros</div>
        
        <div class="filter-group">
            <label class="filter-label">Favoritos</label>
            <div class="filter-checkbox">
                <input type="checkbox" id="filter-favorites">
                <label for="filter-favorites">Solo favoritos</label>
            </div>
        </div>
        
        <div class="filter-group">
            <label class="filter-label">Fuente</label>
            <div class="filter-checkbox">
                <input type="checkbox" id="filter-arxiv" checked>
                <label for="filter-arxiv">ArXiv <span class="badge-preview badge-arxiv">ARXIV</span></label>
            </div>
            <div class="filter-checkbox">
                <input type="checkbox" id="filter-s2" checked>
                <label for="filter-s2">Semantic Scholar <span class="badge-preview badge-s2">S2</span></label>
            </div>
        </div>
        
        <div class="filter-group">
            <label class="filter-label">Novedad</label>
            <div class="filter-checkbox">
                <input type="checkbox" id="filter-new-all" checked>
                <label for="filter-new-all">Todos</label>
            </div>
            <div class="filter-checkbox">
                <input type="checkbox" id="filter-new-today">
                <label for="filter-new-today">🔥 Solo hoy</label>
            </div>
            <div class="filter-checkbox">
                <input type="checkbox" id="filter-new-week">
                <label for="filter-new-week">📌 Última semana</label>
            </div>
        </div>
    </aside>
    
    <main>
        <div id="graph-container" class="active">
            <div id="graph-tooltip">
                <div class="tooltip-title"></div>
                <div class="tooltip-meta"></div>
                <div class="tooltip-abstract"></div>
            </div>
        </div>
        
        <div id="grid-container">
            <div class="grid-section" id="section-new" style="display: none;">
                <h2 class="section-title">🔥 Novedades</h2>
                <div class="papers-grid" id="grid-new"></div>
            </div>
            
            <div class="grid-section">
                <h2 class="section-title">📚 Todos los Papers</h2>
                <div class="papers-grid" id="grid-all"></div>
            </div>
        </div>
    </main>
    
    <script src="https://unpkg.com/3d-force-graph"></script>
    <script>
        let graphData = { nodes: [], links: [] };
        let favorites = JSON.parse(localStorage.getItem('musttela_favorites') || '[]');
        let currentView = 'graph';
        let Graph3D = null;
        
        const filters = {
            favorites: false,
            arxiv: true,
            s2: true,
            newAll: true,
            newToday: false,
            newWeek: false
        };
        
        async function init() {
            try {
                const response = await fetch('graph_data.json');
                graphData = await response.json();
                
                updateStats();
                initGraph3D();
                setupEventListeners();
                renderGridView();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }
        
        function updateStats() {
            const papers = graphData.nodes.filter(n => n.group === 'paper').length;
            const authors = graphData.nodes.filter(n => n.group === 'author').length;
            const topics = graphData.nodes.filter(n => n.group === 'topic').length;
            
            document.getElementById('stat-papers').textContent = papers;
            document.getElementById('stat-authors').textContent = authors;
            document.getElementById('stat-topics').textContent = topics;
        }
        
        function initGraph3D() {
            const container = document.getElementById('graph-container');
            
            Graph3D = ForceGraph3D()(container)
                .graphData(getFilteredData())
                .nodeLabel('name')
                .nodeAutoColorBy('group')
                .nodeColor(node => getNodeColor(node))
                .nodeVal(node => getNodeSize(node))
                .linkWidth(1)
                .linkColor(() => 'rgba(78, 205, 196, 0.2)')
                .onNodeClick(node => handleNodeClick(node))
                .onNodeHover(node => handleNodeHover(node))
                .backgroundColor('#0a0a0a');
        }
        
        function getNodeColor(node) {
            if (node.is_seed) return '#FFD700';
            if (node.group === 'paper' && node.newness_color) return node.newness_color;
            
            const colors = { 'paper': '#4ECDC4', 'author': '#FF6B6B', 'topic': '#95E1D3' };
            return colors[node.group] || '#ffffff';
        }
        
        function getNodeSize(node) {
            if (node.is_seed) return 50;
            
            if (node.group === 'paper' && node.newness_level) {
                const multipliers = { 'today': 1.4, 'new': 1.2, 'recent': 1.1 };
                return (node.val || 30) * (multipliers[node.newness_level] || 1);
            }
            
            return node.val || 10;
        }
        
        function handleNodeHover(node) {
            const tooltip = document.getElementById('graph-tooltip');
            
            if (!node || node.group !== 'paper') {
                tooltip.classList.remove('show');
                return;
            }
            
            tooltip.querySelector('.tooltip-title').textContent = node.name;
            
            let badges = '';
            if (node.is_seed) badges += `<span class="badge badge-seed">${node.seed_badge || '📚 FUNDACIONAL'}</span>`;
            if (node.newness_badge) badges += `<span class="badge badge-new">${node.newness_badge}</span>`;
            if (node.source) {
                const sourceClass = node.source === 'arxiv' ? '' : 's2';
                badges += `<span class="badge badge-source ${sourceClass}">${node.source.toUpperCase()}</span>`;
            }
            
            tooltip.querySelector('.tooltip-meta').innerHTML = badges;
            tooltip.querySelector('.tooltip-abstract').textContent = node.abstract || '';
            tooltip.classList.add('show');
        }
        
        function handleNodeClick(node) {
            if (node.group === 'paper' && node.url) window.open(node.url, '_blank');
        }
        
        function renderGridView() {
            const papers = graphData.nodes.filter(n => n.group === 'paper');
            const filtered = filterPapers(papers);
            const newPapers = filtered.filter(p => p.newness_level);
            
            if (newPapers.length > 0) {
                document.getElementById('section-new').style.display = 'block';
                document.getElementById('grid-new').innerHTML = newPapers.map(createPaperCard).join('');
            } else {
                document.getElementById('section-new').style.display = 'none';
            }
            
            document.getElementById('grid-all').innerHTML = filtered.map(createPaperCard).join('');
        }
        
        function createPaperCard(paper) {
            const isFavorite = favorites.includes(paper.id);
            const favoriteIcon = isFavorite ? '★' : '☆';
            
            let badges = '';
            if (paper.is_seed) badges += `<span class="badge badge-seed">${paper.seed_badge || '📚 FUNDACIONAL'}</span>`;
            if (paper.newness_badge) badges += `<span class="badge badge-new">${paper.newness_badge}</span>`;
            if (paper.source) {
                const sourceClass = paper.source === 'arxiv' ? '' : 's2';
                badges += `<span class="badge badge-source ${sourceClass}">${paper.source.toUpperCase()}</span>`;
            }
            
            return `
                <div class="paper-card ${isFavorite ? 'favorite' : ''}" data-id="${paper.id}">
                    <div class="paper-header">
                        <div class="paper-badges">${badges}</div>
                        <button class="favorite-btn" data-id="${paper.id}">${favoriteIcon}</button>
                    </div>
                    <h3 class="paper-title">${paper.name}</h3>
                    <p class="paper-abstract">${truncate(paper.abstract || '', 200)}</p>
                    <div class="paper-meta">
                        <div>📅 ${paper.date || 'N/A'}</div>
                        ${paper.citation_count ? `<div>📊 ${paper.citation_count} citas</div>` : ''}
                    </div>
                </div>
            `;
        }
        
        function truncate(str, maxLen) {
            if (str.length <= maxLen) return str;
            return str.substr(0, maxLen) + '...';
        }
        
        function filterPapers(papers) {
            return papers.filter(paper => {
                if (filters.favorites && !favorites.includes(paper.id)) return false;
                if (!filters.arxiv && paper.source === 'arxiv') return false;
                if (!filters.s2 && paper.source === 's2') return false;
                if (filters.newToday && paper.newness_level !== 'today') return false;
                if (filters.newWeek && !['today', 'new', 'recent'].includes(paper.newness_level)) return false;
                return true;
            });
        }
        
        function getFilteredData() {
            const filteredPapers = filterPapers(graphData.nodes.filter(n => n.group === 'paper'));
            const paperIds = new Set(filteredPapers.map(p => p.id));
            
            const relatedNodes = new Set();
            graphData.links.forEach(link => {
                if (paperIds.has(link.source.id || link.source)) relatedNodes.add(link.target.id || link.target);
                if (paperIds.has(link.target.id || link.target)) relatedNodes.add(link.source.id || link.source);
            });
            
            const nodes = graphData.nodes.filter(n => paperIds.has(n.id) || relatedNodes.has(n.id));
            const nodeIds = new Set(nodes.map(n => n.id));
            const links = graphData.links.filter(l => {
                const sourceId = l.source.id || l.source;
                const targetId = l.target.id || l.target;
                return nodeIds.has(sourceId) && nodeIds.has(targetId);
            });
            
            return { nodes, links };
        }
        
        function applyFilters() {
            if (currentView === 'graph') {
                Graph3D.graphData(getFilteredData());
            } else {
                renderGridView();
            }
        }
        
        function setupEventListeners() {
            document.querySelectorAll('.view-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentView = e.target.dataset.view;
                    
                    if (currentView === 'graph') {
                        document.getElementById('graph-container').classList.add('active');
                        document.getElementById('grid-container').classList.remove('active');
                    } else {
                        document.getElementById('graph-container').classList.remove('active');
                        document.getElementById('grid-container').classList.add('active');
                        renderGridView();
                    }
                });
            });
            
            document.getElementById('filter-favorites').addEventListener('change', (e) => {
                filters.favorites = e.target.checked;
                applyFilters();
            });
            
            document.getElementById('filter-arxiv').addEventListener('change', (e) => {
                filters.arxiv = e.target.checked;
                applyFilters();
            });
            
            document.getElementById('filter-s2').addEventListener('change', (e) => {
                filters.s2 = e.target.checked;
                applyFilters();
            });
            
            document.getElementById('filter-new-all').addEventListener('change', (e) => {
                if (e.target.checked) {
                    filters.newToday = false;
                    filters.newWeek = false;
                    document.getElementById('filter-new-today').checked = false;
                    document.getElementById('filter-new-week').checked = false;
                }
                filters.newAll = e.target.checked;
                applyFilters();
            });
            
            document.getElementById('filter-new-today').addEventListener('change', (e) => {
                filters.newToday = e.target.checked;
                if (e.target.checked) {
                    filters.newAll = false;
                    document.getElementById('filter-new-all').checked = false;
                }
                applyFilters();
            });
            
            document.getElementById('filter-new-week').addEventListener('change', (e) => {
                filters.newWeek = e.target.checked;
                if (e.target.checked) {
                    filters.newAll = false;
                    document.getElementById('filter-new-all').checked = false;
                }
                applyFilters();
            });
            
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('favorite-btn')) {
                    const paperId = e.target.dataset.id;
                    toggleFavorite(paperId);
                    e.target.textContent = favorites.includes(paperId) ? '★' : '☆';
                    const card = e.target.closest('.paper-card');
                    if (card) card.classList.toggle('favorite', favorites.includes(paperId));
                }
                
                if (e.target.closest('.paper-card') && !e.target.classList.contains('favorite-btn')) {
                    const card = e.target.closest('.paper-card');
                    const paperId = card.dataset.id;
                    const paper = graphData.nodes.find(n => n.id === paperId);
                    if (paper && paper.url) window.open(paper.url, '_blank');
                }
            });
        }
        
        function toggleFavorite(paperId) {
            const index = favorites.indexOf(paperId);
            if (index === -1) {
                favorites.push(paperId);
            } else {
                favorites.splice(index, 1);
            }
            localStorage.setItem('musttela_favorites', JSON.stringify(favorites));
        }
        
        init();
    </script>
</body>
</html>
