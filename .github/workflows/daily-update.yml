name: 🔄 Actualización Diaria

on:
  schedule:
    # Se ejecuta todos los días a las 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:  # También permite trigger manual

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repositorio
        uses: actions/checkout@v3
      
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Instalar dependencias
        run: |
          pip install -r requirements.txt
      
      - name: 🔄 Ejecutar actualización diaria
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd scripts
          python -u daily_update.py
      
      - name: 💾 Commit y Push
        run: |
          git config --global user.name 'Musttela Bot'
          git config --global user.email 'bot@musttela.com'
          git add docs/graph_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 Auto: Actualización diaria" && git push)
