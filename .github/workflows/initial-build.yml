name: 🚀 Llenado Inicial del Grafo

on:
  workflow_dispatch:  # Trigger manual

permissions:
  contents: write

jobs:
  initial-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repositorio
        uses: actions/checkout@v3
      
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Instalar dependencias
        run: |
          pip install -r requirements.txt
      
      - name: 🔨 Ejecutar llenado inicial
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd scripts
          python -u initial_build.py
      
      - name: 💾 Commit y Push
        run: |
          git config --global user.name 'Musttela Bot'
          git config --global user.email 'bot@musttela.com'
          git add docs/graph_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🎉 Llenado inicial completado" && git push)
